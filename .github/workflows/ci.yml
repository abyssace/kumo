name: Java 21 y distribucion local
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar, probar y empaquetar (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sh scripts/package.sh
      - name: Compilar, probar y empaquetar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Probar instalacion y actualizacion (Linux, sin Ollama)
        if: runner.os == 'Linux'
        shell: bash
        run: TMPDIR="$RUNNER_TEMP" sh scripts/smoke-test.sh
      - name: Probar instalacion y actualizacion (Windows, sin Ollama)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -TempRoot $env:RUNNER_TEMP
      - uses: actions/upload-artifact@v4
        with:
          name: kumo-${{ runner.os }}
          path: |
            target/kumo-*.zip
            target/kumo-*.zip.sha256
          if-no-files-found: error
